# TR: Bu dosya bir kategorizasyon KATMANIDIR — gerçek knowledge/
# professional/repository durumu competency-state.yaml'da YAŞAR (one
# fact, one owner). Burada yalnızca Section 20'nin TOOL/TECHNOLOGY/
# PLATFORM/PROTOCOL ayrımı ve kategori grubu tutulur.

tool_categories:
  ai_ml:
    - { id: tool.ai-mock-provider, label: "Deterministic Mock LLM Provider (custom-built)", kind: TOOL, owner: "competency-state.yaml#competency.ai.llm-prompt-testing", note: "TR: Gerçek bir dil modeli DEĞİLDİR — kural tabanlı, tamamen deterministik bir QA fixture'ıdır (bkz. QA-DEMO-SYSTEM/automation-labs/ai-systems/lib/mock-provider.js)." }
    - { id: tech.rag, label: "Retrieval-Augmented Generation (RAG)", kind: TECHNOLOGY, owner: "competency-state.yaml#competency.ai.structured-output-rag-testing" }
    - { id: tech.llm-agents, label: "LLM Agents / Tool-Calling", kind: TECHNOLOGY, owner: "competency-state.yaml#competency.ai.agent-tool-calling-testing" }

  reliability_and_privacy:
    - { id: tool.chaos-fault-injection-fixture, label: "Chaos Fault-Injection Fixture (custom-built)", kind: TOOL, owner: "competency-state.yaml#competency.reliability.chaos-fault-injection-testing", note: "TR: Gerçek bir chaos-engineering aracı DEĞİLDİR (Chaos Monkey/Gremlin/Litmus değil) — lab'ın kendi kontrol ettiği deterministik bir HTTP fixture'ıdır (bkz. QA-DEMO-SYSTEM/automation-labs/chaos-reliability/lib/unreliable-server.js)." }
    - { id: tech.circuit-breaker-pattern, label: "Circuit Breaker Pattern", kind: TECHNOLOGY, owner: "competency-state.yaml#competency.reliability.circuit-breaker-resilience-testing" }
    - { id: tool.pii-response-scanner, label: "PII/Sensitive-Field Response Scanner (custom-built)", kind: TOOL, owner: "competency-state.yaml#competency.privacy.pii-response-scanning" }
    - { id: tech.gdpr-data-subject-rights, label: "GDPR Data-Subject-Rights (Access/Erasure/Anonymization/Consent)", kind: TECHNOLOGY, owner: "competency-state.yaml#competency.privacy.gdpr-data-subject-rights-testing" }

  virtualization_and_property_testing:
    - { id: tool.stub-server, label: "WireMock-Style Stub Server (custom-built)", kind: TOOL, owner: "competency-state.yaml#competency.virtualization.service-virtualization", note: "TR: WireMock DEĞİLDİR — lab'ın kendi yazdığı, gerçek çalışan bir HTTP stub sunucusudur (bkz. QA-DEMO-SYSTEM/automation-labs/service-virtualization/lib/stub-server.js)." }
    - { id: tool.contract-verifier, label: "Consumer-Driven Contract Verifier (custom-built, ajv-based)", kind: TOOL, owner: "competency-state.yaml#competency.virtualization.consumer-driven-contracts", note: "TR: Pact kütüphanesi DEĞİLDİR — ajv (JSON Schema) üzerine kurulu, minimal, gerçek bir sözleşme doğrulayıcıdır." }
    - { id: tech.property-based-testing, label: "Property-Based Testing (custom generator/runner/shrinker)", kind: TECHNOLOGY, owner: "competency-state.yaml#competency.property-testing.generative-invariant-testing", note: "TR: fast-check/jsverify DEĞİLDİR — elle yazılmış, seed'li bir PRNG + shrinker (bkz. QA-DEMO-SYSTEM/automation-labs/property-and-fuzz-testing/lib/property-testing.js)." }
    - { id: tech.fuzz-testing, label: "Structured Fuzz Testing (deterministic hostile-value sets)", kind: TECHNOLOGY, owner: "competency-state.yaml#competency.fuzz-testing.structured-api-fuzzing" }

  mutation_testcontainers_data_engineering:
    - { id: tool.mutation-generator, label: "Mutation Generator (custom-built, text-based)", kind: TOOL, owner: "competency-state.yaml#competency.mutation-testing.mutation-based-test-adequacy", note: "TR: Stryker/PIT/mutmut DEĞİLDİR — altı elle yazılmış operatöre sahip, minimal, metin-tabanlı bir find/replace üreticidir (bkz. QA-DEMO-SYSTEM/automation-labs/mutation-testing/lib/mutate.js)." }
    - { id: tool.testcontainers, label: "Testcontainers", kind: TOOL, owner: "competency-state.yaml#competency.testcontainers.container-based-integration-testing", note: "TR: Bu alandaki diğer lab'ların aksine GERÇEK, üçüncü taraf kütüphanedir — gerçek container yaşam döngüsü yönetimi için makul bir minimal alternatif yoktur (bkz. QA-DEMO-SYSTEM/automation-labs/testcontainers-lab/README.md 'Scope note')." }
    - { id: tech.etl-pipeline, label: "ETL (Extract/Transform) Pipeline (custom-built)", kind: TECHNOLOGY, owner: "competency-state.yaml#competency.data-engineering.etl-pipeline-testing", note: "TR: Airflow/dbt DEĞİLDİR — gerçek backend şemasına karşı minimal, in-process bir extract/transform katmanıdır (bkz. QA-DEMO-SYSTEM/automation-labs/data-engineering/lib/etl.js)." }
    - { id: tech.data-quality-checks, label: "Data Quality Checks (referential integrity, uniqueness, reconciliation, schema drift)", kind: TECHNOLOGY, owner: "competency-state.yaml#competency.data-engineering.data-quality-validation", note: "TR: Great Expectations DEĞİLDİR — dört elle yazılmış kontrol, her biri gerçek temiz veriye karşı sıfır ihlal VE kasıtlı olarak bozulmuş veriye karşı gerçek yakalama ile kanıtlanmıştır (bkz. QA-DEMO-SYSTEM/automation-labs/data-engineering/lib/data-quality.js)." }

  distributed_messaging_supply_chain_compatibility:
    - { id: tech.in-process-message-broker, label: "In-Process Pub/Sub Message Broker (custom-built)", kind: TECHNOLOGY, owner: "competency-state.yaml#competency.distributed-messaging.delivery-semantics-and-dead-lettering", note: "TR: Kafka/RabbitMQ/SQS DEĞİLDİR — kalıcılık, ağ veya partition'lama olmadan, elle yazılmış, bellek-içi bir pub/sub broker'dır (bkz. QA-DEMO-SYSTEM/automation-labs/distributed-messaging/lib/broker.js)." }
    - { id: tech.idempotent-consumer-pattern, label: "Idempotent Consumer Pattern", kind: TECHNOLOGY, owner: "competency-state.yaml#competency.distributed-messaging.idempotent-consumer-design", note: "TR: Aynı simüle edilmiş hata senaryosu non-idempotent ve idempotent consumer'lar üzerinden GERÇEKTEN karşılaştırılarak kanıtlanmıştır (bkz. QA-DEMO-SYSTEM/automation-labs/distributed-messaging/lib/idempotent-consumer.js)." }
    - { id: tool.npm-sbom, label: "npm sbom (built-in CycloneDX SBOM generation)", kind: TOOL, owner: "competency-state.yaml#competency.supply-chain-security.sbom-and-vulnerability-auditing", note: "TR: Ek bir bağımlılık eklenmedi — npm'in kendi yerleşik `npm sbom` komutu, bu repoya karşı gerçek bir CycloneDX SBOM üretmek için kullanıldı (bkz. QA-DEMO-SYSTEM/automation-labs/supply-chain-security/lib/sbom.js)." }
    - { id: tool.npm-audit, label: "npm audit (built-in vulnerability auditing)", kind: TOOL, owner: "competency-state.yaml#competency.supply-chain-security.sbom-and-vulnerability-auditing", note: "TR: Snyk/Dependabot/Sonatype DEĞİLDİR — npm'in kendi yerleşik `npm audit` komutu, bu repoya karşı gerçekten çalıştırıldı (bkz. QA-DEMO-SYSTEM/automation-labs/supply-chain-security/lib/audit.js)." }
    - { id: tech.lockfile-integrity-check, label: "Lockfile Integrity Check (SRI hash coverage, custom-built)", kind: TECHNOLOGY, owner: "competency-state.yaml#competency.supply-chain-security.lockfile-integrity-verification", note: "TR: Bu repo'nun GERÇEK package-lock.json'una karşı çalıştırıldı; 4 yerel workspace sembolik bağlantısının (link: true) false-positive olarak işaretlenmediği doğrulandı (bkz. QA-DEMO-SYSTEM/automation-labs/supply-chain-security/lib/lockfile-integrity.js)." }
    - { id: tech.json-schema-compatibility-contract, label: "Frozen JSON Schema Baseline Contract (custom-built compatibility check)", kind: TECHNOLOGY, owner: "competency-state.yaml#competency.compatibility-testing.breaking-change-detection", note: "TR: Genel bir OpenAPI-diffing motoru DEĞİLDİR — gerçek bir AJV validator ile tek bir gerçek endpoint şekli için dondurulmuş bir baseline'a karşı doğrulama yapar (bkz. QA-DEMO-SYSTEM/automation-labs/compatibility-testing/lib/compatibility-check.js)." }

  i18n_modern_protocols_production_verification:
    - { id: tool.intl-api, label: "Intl API (Node's built-in ICU locale formatting)", kind: TOOL, owner: "competency-state.yaml#competency.i18n-testing.locale-aware-formatting", note: "TR: Ek bir bağımlılık eklenmedi — Node'un kendi yerleşik Intl.NumberFormat/Intl.DateTimeFormat API'si, gerçek ICU verisiyle kullanıldı (bkz. QA-DEMO-SYSTEM/automation-labs/i18n-testing/lib/locale-formatting.js)." }
    - { id: tech.unicode-roundtrip-check, label: "Unicode Multi-Byte Round-Trip Check (custom-built)", kind: TECHNOLOGY, owner: "competency-state.yaml#competency.i18n-testing.unicode-data-integrity", note: "TR: Backend'in GERÇEK products tablosuna karşı Türkçe, Japonca, emoji (non-BMP) ve Arapça (RTL) string'lerle gerçek bir gidiş-dönüş kanıtlanmıştır (bkz. QA-DEMO-SYSTEM/automation-labs/i18n-testing/lib/unicode-roundtrip.js)." }
    - { id: protocol.server-sent-events, label: "Server-Sent Events (hand-rolled, custom-built)", kind: PROTOCOL, owner: "competency-state.yaml#competency.modern-protocols.server-sent-events", note: "TR: gRPC/HTTP2-push/WebRTC DEĞİLDİR — Node'un kendi http modülü üzerinde elle yazılmış, gerçek bir text/event-stream tel protokolüdür (bkz. QA-DEMO-SYSTEM/automation-labs/modern-protocols/lib/sse-server.js)." }
    - { id: tech.synthetic-monitoring, label: "Synthetic Monitoring / Smoke Tests (custom-built)", kind: TECHNOLOGY, owner: "competency-state.yaml#competency.production-verification.synthetic-monitoring", note: "TR: Ticari bir sentetik-izleme platformu (Pingdom/Datadog Synthetics) DEĞİLDİR — gerçek calisan backend'e karsi PASS/SLOW/FAIL siniflandirmasi yapan, elle yazilmis bir calistiricidir (bkz. QA-DEMO-SYSTEM/automation-labs/production-verification/lib/synthetic-monitor.js)." }

  desktop_qa_release_engineering:
    - { id: tool.winappdriver-concept, label: "WinAppDriver / Appium Desktop / Playwright-for-Electron (knowledge only)", kind: TOOL, owner: "competency-state.yaml#competency.desktop-qa.cross-platform-automation-concepts", note: "TR: Bu repoda gerçek bir native masaüstü hedefi hiç mevcut olmadı — hiçbiri gerçekten kurulup çalıştırılmadı; genel bilgi olarak belgelenmiştir." }
    - { id: tech.semver-parser, label: "SemVer 2.0.0 Parser/Comparator (custom-built)", kind: TECHNOLOGY, owner: "competency-state.yaml#competency.release-engineering.semver-and-changelog-integrity", note: "TR: npm'in `semver` paketinin bir sarmalayıcısı DEĞİLDİR — elle yazılmış, spec clause 10/11 (build metadata hariç tutma, prerelease önceliği) dahil gerçek bir ayrıştırıcı/karşılaştırıcıdır (bkz. QA-DEMO-SYSTEM/automation-labs/release-engineering/lib/semver.js)." }
    - { id: tech.changelog-structural-checker, label: "Keep-a-Changelog Structural Checker (custom-built)", kind: TECHNOLOGY, owner: "competency-state.yaml#competency.release-engineering.semver-and-changelog-integrity", note: "TR: Bu reponun KENDİ gerçek CHANGELOG.md dosyasına karşı gerçekten çalıştırıldı (bkz. QA-DEMO-SYSTEM/automation-labs/release-engineering/lib/changelog-check.js)." }
    - { id: tech.canary-rollout-state-machine, label: "Canary Rollout / Automatic Rollback State Machine (custom-built)", kind: TECHNOLOGY, owner: "competency-state.yaml#competency.release-engineering.canary-rollout-and-automatic-rollback", note: "TR: Gerçek bir trafik-kaydırma proxy'si veya deployment-orkestrasyon platformu DEĞİLDİR — process-içi, enjekte edilebilir sağlık-kontrolü fonksiyonuyla gerçek bir durum makinesidir (bkz. QA-DEMO-SYSTEM/automation-labs/release-engineering/lib/rollout-manager.js)." }

