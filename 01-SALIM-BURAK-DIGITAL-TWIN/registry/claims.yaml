# TR: Post-Codex fix (P1-05) — "the most important integrity fix." Öncesinde
# validator yalnızca professional-experience.yaml DOSYASI için bir kaynağın
# VAR OLDUĞUNU kontrol ediyordu (source-provenance.yaml#sources, "covers:
# professional-experience"). Codex bunun yetersiz olduğunu kanıtladı: dosya
# seviyesinde bir kaynak beyanı varken, professional-experience.yaml içine
# UYDURMA bir what_i_did maddesi eklense bile registry validation hâlâ PASS
# ediyordu — çünkü hiçbir kontrol tek tek MADDE seviyesinde çalışmıyordu.
#
# Bu dosya, professional-experience.yaml içindeki HER what_i_did maddesini ve
# HER other_professional_project_exposure maddesini birebir (text eşleşmesi)
# olarak bu claims.yaml'da bir karşılığa bağlar. scripts/registry/validate-registry.mjs
# artık iki yönü de kontrol eder:
#   1) professional-experience.yaml'daki HER madde -> burada eşleşen bir claim
#      kaydı OLMALI (yoksa: "unsourced professional claim", FAIL).
#   2) Bu dosyadaki claim'lerin source_id'si source-provenance.yaml'da gerçekten
#      var olan bir kaynağa çözümlenmeli.
#
# Bu, dosya-seviyesi "bir kaynak var" kontrolünü GEÇERSİZ KILMAZ — onu
# TAMAMLAR. Section 42 "NO CLAIM WITHOUT SOURCE" kuralının madde seviyesinde
# uygulanmasıdır.
