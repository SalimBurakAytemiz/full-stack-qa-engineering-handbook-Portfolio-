# TR: Bu dosya Section 9'un üç-boyutlu modelini uygular: knowledge,
# professional ve repository BİRBİRİNDEN BAĞIMSIZDIR ve tek bir
# "experience" alanına asla birleştirilmez (Section 9: "Do not collapse
# them into one EXPERIENCE field"). repository.status değerleri, bu repo
# içindeki Phase 6-19 campaign kanıtlarından (backend 157/157,
# GitHub Actions 4/4) GERÇEKTEN doğrulanmış durumu yansıtır — icat
# edilmemiştir.

# knowledge:    AWARE | WORKING | INDEPENDENT | ADVANCED | UNKNOWN
# professional.status: NONE | OBSERVED | PARTICIPATED | EXECUTED | OWNED
# repository.status:   NOT_PRACTICED | DOCUMENTED | IMPLEMENTED | EXECUTED | CI_VERIFIED | AUDITED

