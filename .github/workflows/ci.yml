name: QA Demo System CI

# Phase 12 — CI/CD & Environment. A real, runnable pipeline (unlike the
# Selenium/JMeter labs in Phase 10, this runs on GitHub's own runners and
# is not subject to this repository's sandboxed-session network
# restrictions) — genuinely verifiable via the Actions run it produces.
on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

defaults:
  run:
    working-directory: QA-DEMO-SYSTEM

jobs:
  registry-integrity:
    # Increment 2 — wires the registry validator (scripts/registry/
    # validate-registry.mjs) into CI as a real quality gate, not a
    # decorative always-pass step. Runs at the repo root (overriding the
    # job-default QA-DEMO-SYSTEM working directory above), where the
    # registry's own package.json and node_modules live — a completely
    # separate npm workspace from QA-DEMO-SYSTEM. No `needs:` — this is a
    # pure docs/registry check with no dependency on a running server.
    name: Registry integrity (schema, relationships, generated-output, claim provenance)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run registry:validate
      # Post-Codex fix (section 14/15): the regression suite proves the
      # validator's negative/positive behavior against real files (claim
      # provenance, domain FK, CI_VERIFIED evidence, EOL-normalized drift,
      # relationship semantics) — one of its 9 cases spawns the GraphQL
      # contract-drift test, which needs QA-DEMO-SYSTEM/backend's own
      # separate npm workspace installed (see .ai/DECISIONS.md D1).
      - run: npm ci
        working-directory: QA-DEMO-SYSTEM
      - run: node --test scripts/registry/validate-registry.regression.test.mjs

  backend-tests:
    name: Backend unit/integration tests (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test --workspace backend

  web-tests:
    name: Web QA (Playwright — functional/visual/accessibility)
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # GitHub-hosted runners have full internet access (unlike this
      # repo's own sandboxed development session — see Phase 10/12
      # EXECUTION.md) so a real Chromium download here is expected to
      # succeed.
      - run: npx playwright install --with-deps chromium
        working-directory: QA-DEMO-SYSTEM/web-tests
      - run: npm test --workspace web-tests

  api-schema-validation:
    name: API schema validation (Newman + AJV)
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # api-tests' scripts assume a live server at localhost:3000 (see
      # postman/environments/local.postman_environment.json) — they don't
      # start one themselves, so CI must, same as every local run in this
      # campaign's evidence files.
      #
      # Codex fix-campaign N3 (non-blocking): the real default DB path
      # (backend/src/config/index.js, when DB_PATH is unset) is
      # backend/data/qa-demo.db — this cleanup previously targeted
      # data/qa-demo.db (one level too shallow), which never matched a
      # real file. Harmless on GitHub's always-fresh, ephemeral runners
      # (rm -f on a nonexistent path is a silent no-op, and the server
      # auto-seeds an empty DB either way), but still a real latent bug —
      # fixed to the correct path.
      - name: Start backend server
        run: |
          rm -f backend/data/qa-demo.db
          nohup node backend/src/server.js > /tmp/ci-backend.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 0.5
          done
          echo "Backend did not become healthy in time"; cat /tmp/ci-backend.log; exit 1
      - run: npm run api:test:postman --workspace api-tests

  api-auth-tests:
    # Post-Codex fix (P1-03): this package (protected/auth collection,
    # 19 requests / 42 assertions locally proven — see
    # api-tests/README.md section on P5.3) existed and passed locally
    # since P5.3 but was never wired into CI, so the CI-facing maturity
    # claim did not match reality. Stateless (no seed-order dependency,
    # unlike orders-payment/notifications/db below), so it runs exactly
    # like api-schema-validation above.
    name: API auth/authorization tests (Newman)
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Start backend server
        run: |
          rm -f backend/data/qa-demo.db
          nohup node backend/src/server.js > /tmp/ci-backend.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 0.5
          done
          echo "Backend did not become healthy in time"; cat /tmp/ci-backend.log; exit 1
      - run: npm run api:test:auth --workspace api-tests

  api-orders-payment-tests:
    # Post-Codex fix (P1-03): stock mutations make this suite
    # order-sensitive, so a fresh db:seed immediately before starting
    # the server (same sequence api-tests/README.md documents for local
    # runs) is required for reproducibility — this is why this package
    # was not simply added to api-schema-validation above.
    name: API orders/payment business tests (Newman + AJV)
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Seed and start backend server
        run: |
          rm -f backend/data/qa-demo.db
          npm run db:seed
          nohup node backend/src/server.js > /tmp/ci-backend.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 0.5
          done
          echo "Backend did not become healthy in time"; cat /tmp/ci-backend.log; exit 1
      - run: npm run api:test:orders-payment --workspace api-tests

  api-notifications-tests:
    # Post-Codex fix (P1-03): same seed-before-server requirement as
    # orders-payment above (order/notification state mutations).
    name: API notifications tests (Newman + AJV)
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Seed and start backend server
        run: |
          rm -f backend/data/qa-demo.db
          npm run db:seed
          nohup node backend/src/server.js > /tmp/ci-backend.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 0.5
          done
          echo "Backend did not become healthy in time"; cat /tmp/ci-backend.log; exit 1
      - run: npm run api:test:notifications --workspace api-tests

  api-db-validation:
    # Post-Codex fix (P1-03): API<->DB validation (scripts/run-api-db-validation.js)
    # reads SQLite directly (node:sqlite, read-only) alongside real API
    # calls, so it needs the exact same fresh-seed sequence as
    # api-tests/README.md's local instructions.
    name: API-to-DB validation (node:sqlite + fetch)
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Seed and start backend server
        run: |
          rm -f backend/data/qa-demo.db
          npm run db:seed
          nohup node backend/src/server.js > /tmp/ci-backend.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 0.5
          done
          echo "Backend did not become healthy in time"; cat /tmp/ci-backend.log; exit 1
      - run: npm run api:test:db --workspace api-tests

  selenium-lab:
    # Codex fix-campaign B4 (P2, Phase 10): the CI/CD scope item for the
    # Selenium lab was previously entirely absent. GitHub-hosted
    # ubuntu-latest runners ship a real Google Chrome + matching
    # chromedriver and have full internet access (unlike this repo's own
    # sandboxed dev session, where a chromedriver/Chromium version
    # mismatch plus a network-blocked driver download made this lab
    # EXECUTION BLOCKED — see automation-labs/EXECUTION.md section 2.2).
    # driver-factory.js's Selenium Manager auto-discovery (no hardcoded
    # binary path unless CHROME_BINARY_PATH is set) is exactly what makes
    # this portable to a runner like this one, unmodified.
    name: Selenium lab (real browser automation, CI-only real pass)
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Start backend server
        run: |
          rm -f backend/data/qa-demo.db
          nohup node backend/src/server.js > /tmp/ci-backend.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 0.5
          done
          echo "Backend did not become healthy in time"; cat /tmp/ci-backend.log; exit 1
      - run: npm run selenium:test --workspace automation-labs
        env:
          QA_DEMO_BASE_URL: http://127.0.0.1:3000
      # Codex final-verification fix (F6): proves the lifecycle safety net
      # (bounded driver-startup timeout, explicit-outcome-or-forced-nonzero
      # exit) actually works, on THIS runner's real environment (real
      # Chrome — the "genuine EXECUTED, 2/2 passed, exit 0" branch) and via
      # fault injection (the "silent-exit"/"hung driver" branches, which
      # don't need a real browser). Portable by design — passes here and
      # in a Chrome-less sandbox alike.
      - run: node --test automation-labs/selenium/tests/login-flow-lifecycle.regression.test.js
        env:
          QA_DEMO_BASE_URL: http://127.0.0.1:3000
      # Codex final-verification fix (N2): real parallel execution
      # (independent concurrent WebDriver sessions), then its own
      # adversarial lifecycle regression suite (bounded per-session
      # action/cleanup, whole-run deadline, hard-exit-guaranteed
      # termination even with a real leaked handle in one session).
      - run: npm run selenium:test:parallel --workspace automation-labs
        env:
          QA_DEMO_BASE_URL: http://127.0.0.1:3000
      - run: node --test automation-labs/selenium/scripts/run-parallel-lifecycle.regression.test.js
        env:
          QA_DEMO_BASE_URL: http://127.0.0.1:3000

  ai-systems-lab:
    # Part 2 — Advanced QA Engineering: AI/ML/LLM Systems Testing.
    # Mock-first by design (AI_TEST_MODE=mock is the default and the only
    # mode this job ever runs) — no backend server, no network access, and
    # no API key (OPENAI_API_KEY/ANTHROPIC_API_KEY/GEMINI_API_KEY) is
    # required or read here. No `needs: backend-tests` — this lab is
    # entirely self-contained against a deterministic mock provider (see
    # automation-labs/ai-systems/README.md for the scope boundary).
    name: AI Systems Testing lab (mock-first, deterministic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run ai:test --workspace automation-labs

  chaos-reliability-lab:
    # Part 2 — Advanced QA Engineering: Chaos Engineering & Reliability
    # Testing (Milestone 2.2). Entirely self-contained — the
    # "unreliable dependency" is a local fixture server this lab starts
    # and stops itself (see automation-labs/chaos-reliability/README.md
    # for the scope boundary). No `needs: backend-tests`, no network
    # access, no external service.
    name: Chaos/Reliability lab (deterministic fault injection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run chaos:test --workspace automation-labs

  privacy-testing-lab:
    # Part 2 — Advanced QA Engineering: Privacy Testing (Milestone 2.2).
    # Unlike the AI/chaos labs, this one DOES need a running backend —
    # its PII/sensitive-field response scanner genuinely scans real API
    # responses (see automation-labs/privacy-testing/README.md). Same
    # seed-and-start-server sequence as the other backend-dependent
    # jobs above. The data-subject-rights part of this lab is a
    # disclosed in-memory fixture and needs no server.
    name: Privacy Testing lab (real-backend PII scan + data-subject-rights fixture)
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Seed and start backend server
        run: |
          rm -f backend/data/qa-demo.db
          npm run db:seed
          nohup node backend/src/server.js > /tmp/ci-backend.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 0.5
          done
          echo "Backend did not become healthy in time"; cat /tmp/ci-backend.log; exit 1
      - run: npm run privacy:test --workspace automation-labs
        env:
          QA_DEMO_BASE_URL: http://127.0.0.1:3000

  service-virtualization-lab:
    # Part 2 — Advanced QA Engineering: Service Virtualization & Contract
    # Testing (Milestone 2.3). Consumer-side checks (stub server,
    # consumer-contract verification) are self-contained; provider-side
    # contract verification needs a running backend — same
    # seed-and-start-server sequence as the other backend-dependent jobs.
    name: Service Virtualization & Contract Testing lab (stub server + real provider verification)
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Seed and start backend server
        run: |
          rm -f backend/data/qa-demo.db
          npm run db:seed
          nohup node backend/src/server.js > /tmp/ci-backend.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 0.5
          done
          echo "Backend did not become healthy in time"; cat /tmp/ci-backend.log; exit 1
      - run: npm run virtualization:test --workspace automation-labs
        env:
          QA_DEMO_BASE_URL: http://127.0.0.1:3000

  property-and-fuzz-testing-lab:
    # Part 2 — Advanced QA Engineering: Property-Based & Fuzz Testing
    # (Milestone 2.3). Property tests run against a real in-memory
    # SQLite db (no server needed); fuzz testing needs a running
    # backend — same seed-and-start-server sequence as the other
    # backend-dependent jobs. This exact suite found and drove the fix
    # for a real backend bug (see backend/src/middleware/errorHandler.js
    # and this lab's COMMON-MISTAKES.md).
    name: Property-Based & Fuzz Testing lab (real backend properties + real-API fuzzing)
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Seed and start backend server
        run: |
          rm -f backend/data/qa-demo.db
          npm run db:seed
          nohup node backend/src/server.js > /tmp/ci-backend.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 0.5
          done
          echo "Backend did not become healthy in time"; cat /tmp/ci-backend.log; exit 1
      - run: npm run property-fuzz:test --workspace automation-labs
        env:
          QA_DEMO_BASE_URL: http://127.0.0.1:3000
