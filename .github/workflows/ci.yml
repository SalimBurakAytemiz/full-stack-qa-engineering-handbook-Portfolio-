name: QA Demo System CI

# Phase 12 — CI/CD & Environment. A real, runnable pipeline (unlike the
# Selenium/JMeter labs in Phase 10, this runs on GitHub's own runners and
# is not subject to this repository's sandboxed-session network
# restrictions) — genuinely verifiable via the Actions run it produces.
on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

defaults:
  run:
    working-directory: QA-DEMO-SYSTEM

jobs:
  registry-integrity:
    # Increment 2 — wires the registry validator (scripts/registry/
    # validate-registry.mjs) into CI as a real quality gate, not a
    # decorative always-pass step. Runs at the repo root (overriding the
    # job-default QA-DEMO-SYSTEM working directory above), where the
    # registry's own package.json and node_modules live — a completely
    # separate npm workspace from QA-DEMO-SYSTEM. No `needs:` — this is a
    # pure docs/registry check with no dependency on a running server.
    name: Registry integrity (schema, relationships, generated-output)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run registry:validate

  backend-tests:
    name: Backend unit/integration tests (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test --workspace backend

  web-tests:
    name: Web QA (Playwright — functional/visual/accessibility)
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # GitHub-hosted runners have full internet access (unlike this
      # repo's own sandboxed development session — see Phase 10/12
      # EXECUTION.md) so a real Chromium download here is expected to
      # succeed.
      - run: npx playwright install --with-deps chromium
        working-directory: QA-DEMO-SYSTEM/web-tests
      - run: npm test --workspace web-tests

  api-schema-validation:
    name: API schema validation (Newman + AJV)
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # api-tests' scripts assume a live server at localhost:3000 (see
      # postman/environments/local.postman_environment.json) — they don't
      # start one themselves, so CI must, same as every local run in this
      # campaign's evidence files.
      #
      # Codex fix-campaign N3 (non-blocking): the real default DB path
      # (backend/src/config/index.js, when DB_PATH is unset) is
      # backend/data/qa-demo.db — this cleanup previously targeted
      # data/qa-demo.db (one level too shallow), which never matched a
      # real file. Harmless on GitHub's always-fresh, ephemeral runners
      # (rm -f on a nonexistent path is a silent no-op, and the server
      # auto-seeds an empty DB either way), but still a real latent bug —
      # fixed to the correct path.
      - name: Start backend server
        run: |
          rm -f backend/data/qa-demo.db
          nohup node backend/src/server.js > /tmp/ci-backend.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 0.5
          done
          echo "Backend did not become healthy in time"; cat /tmp/ci-backend.log; exit 1
      - run: npm run api:test:postman --workspace api-tests

  selenium-lab:
    # Codex fix-campaign B4 (P2, Phase 10): the CI/CD scope item for the
    # Selenium lab was previously entirely absent. GitHub-hosted
    # ubuntu-latest runners ship a real Google Chrome + matching
    # chromedriver and have full internet access (unlike this repo's own
    # sandboxed dev session, where a chromedriver/Chromium version
    # mismatch plus a network-blocked driver download made this lab
    # EXECUTION BLOCKED — see automation-labs/EXECUTION.md section 2.2).
    # driver-factory.js's Selenium Manager auto-discovery (no hardcoded
    # binary path unless CHROME_BINARY_PATH is set) is exactly what makes
    # this portable to a runner like this one, unmodified.
    name: Selenium lab (real browser automation, CI-only real pass)
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Start backend server
        run: |
          rm -f backend/data/qa-demo.db
          nohup node backend/src/server.js > /tmp/ci-backend.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 0.5
          done
          echo "Backend did not become healthy in time"; cat /tmp/ci-backend.log; exit 1
      - run: npm run selenium:test --workspace automation-labs
        env:
          QA_DEMO_BASE_URL: http://127.0.0.1:3000
