    related_lab: lab.performance.jmeter
    note: "Codex post-audit fix (P2-04, split A of 3): parameterized Thread Group (threads/rampUp/loops), CSV-driven test data, and a DurationAssertion threshold (3000ms) in every sampler's hashTree — a real workload/threshold design, distinct from whether the real binary could execute it (see .jmeter-real-execution-blocked below) or whether its fail-gate logic was validated (see .jmeter-fail-gate-logic below)."

  - id: evidence.performance.jmeter-fail-gate-logic
    label: "JMeter fail-gate logic — JTL-content-based PASS/FAIL, fixture-tested"
    maturity: E3_EXECUTED
    artifact: "QA-DEMO-SYSTEM/automation-labs/jmeter/scripts/run-jmeter.test.js"
    produced_by: "node --test run-jmeter.test.js — 7/7 PASS, real execution, independent of the real JMeter runtime (fixture JTL files)"
    related_lab: lab.performance.jmeter
    note: "Codex post-audit fix (P2-04, split B of 3): this is deterministic fail-gate VALIDATION LOGIC being tested (does the wrapper correctly parse a JTL file's success/failure column and report PASS/FAIL?), genuinely executed and genuinely PASSING — NOT a real JMeter load run. JMeter's own process exit code does not reliably reflect internal sample/assertion failures (empirically confirmed — a real JMeter crash still exited 0, see PHASE-10-AUTOMATION-LEARNING-LABS/EXECUTION.md section 3.5); the wrapper inspects the JTL file content instead, and that inspection logic is what these 7 tests prove works."

  - id: evidence.performance.jmeter-real-execution-blocked
    label: "JMeter real binary execution — attempted, root cause diagnosed, BLOCKED (not a successful load run)"
    maturity: E1_DOCUMENTED
    artifact: "QA-DEMO-SYSTEM/evidence/PHASE-10-AUTOMATION-LEARNING-LABS/EXECUTION.md"
    produced_by: "jmeter -n -t ... (real binary invocation, multiple attempts including JMeter's own stock template as an isolation control) — every attempt failed with the same com.thoughtworks.xstream.security.ForbiddenClassException"
    related_lab: lab.performance.jmeter
    note: "Codex post-audit fix (P2-04, split C of 3): do NOT present this as a successful load run. Root cause is environment-specific (this sandbox's apt jmeter 2.13 package predates a modern XStream version's security-policy defaults — see EXECUTION.md section 3 for the full isolation trace against JMeter's own stock template, which failed identically), not a defect in this repository's own .jmx/wrapper code. run-jmeter.js (see .jmeter-fail-gate-logic above) correctly detects and reports this real failure as JMETER_STATUS: LAUNCH_OR_RUNTIME_ERROR, exit code 1 — that correct detection is itself real, executed behavior, but the underlying load test never produced real load-test results in this environment. maturity is E1_DOCUMENTED (a real, thoroughly diagnosed attempt is documented), explicitly not E3_EXECUTED or E4_CI_VERIFIED."

