# Relationship registry (Section 41). Controlled-vocabulary edges between
# catalog entries — see shared/registry/schemas/relationship.schema.json
# for the predicate list. Built by a systematic pass across competencies,
# domains, tools, patterns, labs, evidence, professional experience, and
# gaps (not just an increasing edge count) — see .ai/DECISIONS.md for the
# pass's method. Every edge connects two ids that are real, loaded
# registry entries; scripts/registry/validate-registry.mjs enforces this
# (a relationship to a fabricated or not-yet-built entry fails CI).
#
# The two mandated traceability paths (see .ai/DECISIONS.md) are:
#   COMPETENCY -> DOMAIN/PATTERN -> TOOL -> LAB -> TEST/EVIDENCE
#   PROFESSIONAL EXPERIENCE -> DOMAIN -> COMPETENCY -> repository practice/evidence
# Both are walkable end-to-end for the E-Commerce/FinTech core; see the
# "core traceability" section below for the explicit edges that prove it.
