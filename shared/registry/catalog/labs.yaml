# Universal executable-lab catalog (Section 30). Each entry points to real,
# checked-in code — no lab is listed here without a real path that exists
# in the repository at HEAD.
# Codex final-verification fix (N1): `covers_competencies` was added to
# every entry below — the exact, structured declaration of which
# competencies this lab genuinely exercises (grounded in the SAME 13
# PRACTICED_IN edges already in relationships.yaml before this fix; no
# new coverage is invented, only made explicit). This is what lets
# validate-registry.mjs answer "does this lab actually practice this
# competency?" instead of only checking the competency's own maturity
# rank — see that file's PRACTICED_IN coverage-semantics check.
# TR: `covers_competencies`, bir lab'ın GERÇEKTEN neyi çalıştırdığının
# yapılandırılmış beyanıdır — relationships.yaml'daki MEVCUT 13
# PRACTICED_IN kenarına dayanır, yeni bir kapsam UYDURULMAZ. Bu alan
# olmadan validator yalnızca competency'nin KENDİ repository.status
# rütbesine bakabiliyordu — hedef lab'ın o competency'yi gerçekten
# kapsayıp kapsamadığını hiç SORAMIYORDU (Codex'in GraphQL/Locust
# örneğinin YAKALANAMAMASININ nedeni tam olarak buydu).
