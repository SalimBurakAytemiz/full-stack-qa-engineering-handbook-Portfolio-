    path: "02-FULL-STACK-QA-HANDBOOK/22-SYSTEM-PATTERNS/RETRY.md"
    note: "Independent review finding F4: corrected from DOCUMENTED_ONLY (the earlier P2-05 correction, made before these labs existed). MAIN QA-DEMO BACKEND (backend/src) still has no retry mechanism — unchanged, still accurate. Two ISOLATED EXECUTABLE LABS built afterward now genuinely implement and exercise real retry logic: chaos-reliability's lib/resilient-client.js (real bounded retry with backoff against a deliberately unreliable fixture) and distributed-messaging's lib/broker.js (real redelivery against a configured retry budget before dead-lettering), both CI-verified (see labs.yaml). The JMeter fail-gate wrapper still explicitly does NOT auto-retry, by design — see RETRY.md's 'Related labs' section for the full, current list."

